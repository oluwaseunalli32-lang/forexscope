services:
  - type: worker
    name: lemvest-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python lemvest.py
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: BOT_TOKEN
        sync: false
      - key: CHANNEL_URL
        value: "https://t.me/+_uVZZCHw7U1lMGZk"
